name: "每日形态扫描"

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      pool:
        description: '股票池来源 (sina/csv/seed)'
        required: false
        default: 'sina'
        type: choice
        options:
          - sina
          - csv
          - seed
      limit:
        description: '扫描数量上限 (0=全部)'
        required: false
        default: '0'
        type: string

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Install dependencies"
        run: pip install --upgrade pip && pip install -r zhushenglang/requirements.txt

      - name: "Debug: Check PushPlus token"
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "WARNING: PUSHPLUS_TOKEN is not set!"
          else
            echo "PUSHPLUS_TOKEN is set (length: ${#PUSHPLUS_TOKEN})"
          fi

      - name: "Run pattern scanner"
        id: scan
        run: |
          cd zhushenglang
          python3 -m src.scanner --pool "${{ github.event.inputs.pool || 'sina' }}" --limit "${{ github.event.inputs.limit || '0' }}" --workers 12 --min-score 50 --push --out "outputs/aiai_pattern_scan_$(date '+%Y%m%d_%H%M').csv" 2>&1 | tee scan_output.txt
        continue-on-error: true

      - name: "Generate HTML report"
        run: |
          cd zhushenglang
          LATEST_CSV=$(ls -t outputs/aiai_pattern_scan_*.csv 2>/dev/null | head -1)
          if [ -z "$LATEST_CSV" ]; then
            echo "No CSV found, skipping report"
            exit 0
          fi
          python3 -m src.report "$LATEST_CSV" "docs/aiai_report_$(date '+%Y%m%d_%H%M').html"
        continue-on-error: true

      - name: "Update index page"
        run: cd zhushenglang && python3 update_index.py
        continue-on-error: true

      - name: "Copy reports to root docs for GitHub Pages"
        run: |
          mkdir -p docs
          cp zhushenglang/docs/aiai_report_*.html docs/ 2>/dev/null || true
          cp zhushenglang/docs/index.html docs/ 2>/dev/null || true
          ls -la docs/
        continue-on-error: true

      - name: "Commit and push reports"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/ zhushenglang/docs/ zhushenglang/outputs/ zhushenglang/cache/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-scan report $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi
        continue-on-error: true

      - name: "Upload scan results as artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            zhushenglang/scan_output.txt
            zhushenglang/outputs/*.csv
            docs/*.html
          retention-days: 30
